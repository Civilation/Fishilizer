name: Sync Lua to Website

on:
  push:
    branches:
      - main
      - master

jobs:
  sync-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v3

      - name: Push to Website Repo
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.WEBSITE_TOKEN }}
        with:
          source_file: 'Fishilizer.lua'
          destination_repo: 'fishilizer/fishilizer.github.io'
          destination_branch: 'main'
          destination_folder: '' 
          user_email: 'civilation@users.noreply.github.com'
          user_name: 'Civilation'
          commit_message: 'Auto-sync Fishilizer.lua from main repo'
